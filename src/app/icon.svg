<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Background -->
  <rect width="500" height="500" fill="#000000" />
  
  <!-- Main Badge Circle -->
  <circle cx="250" cy="275" r="180" fill="#000000" stroke="#FFD700" stroke-width="8" />

  <!-- Top Dome / Arch -->
  <path d="M 60,170 
           Q 150,220 250,160 
           Q 350,220 440,170 
           Q 390,120 350,110 
           Q 300,70 250,30 
           Q 200,70 150,110 
           Q 110,120 60,170 Z" 
        fill="#000000" stroke="#FFD700" stroke-width="8" stroke-linejoin="round" />
        
  <!-- Dome Inner Ornaments -->
  <circle cx="250" cy="115" r="18" fill="#FFD700" />
  <!-- Left dash -->
  <path d="M 180,120 Q 210,105 220,110" stroke="#FFD700" stroke-width="8" stroke-linecap="round" fill="none" />
  <!-- Right dash -->
  <path d="M 320,120 Q 290,105 280,110" stroke="#FFD700" stroke-width="8" stroke-linecap="round" fill="none" />

  <!-- "SALAFI" Text -->
  <text x="250" y="240" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="42" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">SALAFI</text>

  <!-- "MADRASA" Banner -->
  <rect x="0" y="260" width="500" height="75" fill="#FFFFFF" />
  <text x="250" y="312" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="52" fill="#000000" text-anchor="middle" letter-spacing="1">MADRASA</text>

  <!-- "PORTAL" Text -->
  <text x="250" y="390" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="38" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">PORTAL</text>

  <!-- "MSM Attanikkal" Banner -->
  <rect x="90" y="420" width="320" height="50" fill="#FFD700" rx="0" />
  <text x="250" y="454" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="24" fill="#000000" text-anchor="middle" letter-spacing="0.5">MSM ATTANIKKAL</text>
  
  <!-- Hide the bottom part of the circle that extends below the yellow banner if needed -->
  <!-- The circle shouldn't peek under the banner since the banner is at y=420..470, circle bottom is cy+r = 275+180=455. The banner covers it well. -->

</svg>
